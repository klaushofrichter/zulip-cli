name: Release

on:
  push:
    branches: [release]
  workflow_dispatch: {}

permissions:
  contents: write

env:
  # Force checkout/setup-node off the deprecated Node 20 action runtime.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Smoke test (CLI loads & prints help)
        run: node zulip.ts --help

      - name: Build tarball
        id: pack
        run: |
          set -euo pipefail
          TARBALL=$(npm pack --silent)
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          ls -lh "$TARBALL"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}-$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          gh release create "$TAG" "${{ steps.pack.outputs.tarball }}" \
            --title "$TAG" \
            --notes "Automated release from \`release\` branch (commit ${GITHUB_SHA})." \
            --target "$GITHUB_SHA"
